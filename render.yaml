services:
  # Backend API Service
  - type: web
    name: inventory-api
    runtime: node
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGINS
        sync: false  # Set in Render dashboard after frontend is deployed
    healthCheckPath: /api/products

  # Frontend Static Site
  - type: web
    name: inventory-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false  # Set in Render dashboard after backend is deployed
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
